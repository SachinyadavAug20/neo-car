<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fdf6e3"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="none" stroke="#1a1a2e" stroke-width="4"/>
  
  <!-- Paper crane -->
  <g transform="translate(540, 200)">
    <path d="M0 -80 L120 0 L0 -30 L-120 0 Z" fill="#1a1a2e" opacity="0.85"/>
    <path d="M0 -30 L0 80" stroke="#1a1a2e" stroke-width="3"/>
    <path d="M0 -30 L120 0 L80 50" fill="#1a1a2e" opacity="0.6"/>
    <path d="M0 -30 L-120 0 L-80 50" fill="#1a1a2e" opacity="0.6"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#1a1a2e" letter-spacing="-3">DRIFT</text>
  <text x="600" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#1a1a2e" opacity="0.6">A Paper World</text>
  
  <!-- Subtitle -->
  <text x="600" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1a1a2e" opacity="0.45">Interactive 3D Paper Craft Storytelling</text>
  
  <!-- Decorative dots -->
  <circle cx="120" cy="560" r="4" fill="#1a1a2e" opacity="0.15"/>
  <circle cx="150" cy="560" r="4" fill="#1a1a2e" opacity="0.25"/>
  <circle cx="180" cy="560" r="4" fill="#1a1a2e" opacity="0.35"/>
  <circle cx="210" cy="560" r="4" fill="#1a1a2e" opacity="0.45"/>
  <circle cx="240" cy="560" r="4" fill="#1a1a2e" opacity="0.55"/>
  
  <text x="600" y="580" text-anchor="middle" font-family="monospace" font-size="14" fill="#1a1a2e" opacity="0.3">drift-paper.vercel.app</text>
</svg>
